<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Almacen A</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f0;min-height:100vh;font-size:14px;touch-action:pan-x pan-y pinch-zoom}
.hdr{background:#1a1a2e;color:#fff;padding:10px 14px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.hdr-title{font-size:15px;font-weight:600}
.hdr-sub{font-size:10px;color:#8888aa;margin-top:1px}
.tabs{display:flex;background:#16213e}
.tab{flex:1;padding:10px 4px;font-size:11px;font-weight:600;color:#6677aa;text-align:center;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .15s}
.tab.on{color:#e94560;border-bottom-color:#e94560}
.body{padding:10px;max-width:600px;margin:0 auto}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sc{background:#fff;border-radius:8px;padding:10px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sv{font-size:22px;font-weight:700;color:#1a1a2e}
.sl{font-size:10px;color:#888;margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.sec-lbl{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;padding:10px 12px;border-bottom:.5px solid #f0f0f0;gap:8px}
.row:last-child{border-bottom:none}
.rref{font-size:13px;font-weight:700;color:#1a1a2e}
.rdesc{font-size:11px;color:#888;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.rmeta{font-size:10px;color:#aaa;margin-top:2px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;white-space:nowrap}
.bv{background:#fff0f0;color:#c0392b}
.bg{background:#f0fff4;color:#27ae60}
.bp{background:#f0f4ff;color:#0f3460}
.panel{display:none}
.panel.on{display:block}
.srch{width:100%;padding:11px 14px;font-size:15px;border:1.5px solid #ddd;border-radius:8px;background:#fff;color:#1a1a2e;margin-bottom:10px;outline:none}
.srch:focus{border-color:#e94560}
.chips{display:flex;gap:6px;margin-bottom:10px}
.chip{font-size:11px;padding:5px 12px;border-radius:20px;border:1.5px solid #ddd;cursor:pointer;color:#666;background:#fff;font-weight:600}
.chip.on{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.rot-bg{height:5px;border-radius:3px;background:#f0f0f0;flex:1}
.rot-fill{height:5px;border-radius:3px}
.rank{font-size:11px;font-weight:700;color:#aaa;min-width:20px}
.empty{text-align:center;padding:30px;color:#aaa;font-size:13px}
.ubi-big{font-size:18px;font-weight:800;color:#0f3460;letter-spacing:.05em}
.frow{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.frow::-webkit-scrollbar{display:none}
.fp{font-size:10px;font-weight:700;padding:5px 10px;border-radius:6px;border:1.5px solid #ddd;cursor:pointer;white-space:nowrap;background:#fff;color:#666}
.fp.on{background:#0f3460;color:#fff;border-color:#0f3460}
.btn-occ{border:none;background:#e8f8ee;color:#27ae60;font-size:11px;font-weight:700;padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-occ:active{background:#27ae60;color:#fff}
.row-occ{background:#f8fff8}
.btn-undo{border:none;background:#f0f0f0;color:#888;font-size:10px;font-weight:700;padding:6px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.loading{text-align:center;padding:40px 20px}
.loading-spin{width:32px;height:32px;border:3px solid #eee;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:#888}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:20px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:14px 14px 0 0;padding:20px 16px 32px;width:100%;max-width:500px}
.sheet-title{font-size:13px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.detail-ref{font-size:24px;font-weight:800;color:#1a1a2e;margin-bottom:4px}
.detail-desc{font-size:13px;color:#666;margin-bottom:16px;line-height:1.4}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid #f0f0f0}
.detail-row:last-child{border-bottom:none}
.detail-lbl{font-size:12px;color:#aaa;font-weight:500}
.detail-val{font-size:14px;font-weight:700;color:#1a1a2e}
.detail-ubi{font-size:22px;font-weight:800;color:#0f3460;letter-spacing:.05em}
.btn-close{width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:#f0f0f0;color:#555;margin-top:16px}
.err-banner{background:#fff0f0;border:1.5px solid #f0b0b0;border-radius:8px;padding:14px;margin-bottom:10px;font-size:12px;color:#c0392b}
.err-banner b{display:block;margin-bottom:4px;font-size:13px}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="hdr-title">Almacen A</div><div class="hdr-sub" id="hsub">Cargando datos...</div></div>
</div>
<div class="tabs">
  <div class="tab on" onclick="sw(0)">Vacias</div>
  <div class="tab" onclick="sw(1)">Rotacion</div>
  <div class="tab" onclick="sw(2)">Buscar</div>
</div>
<div class="body">
  <div id="pv" class="panel on">
    <div id="sRow" class="stats"></div>
    <div class="frow" id="vFil"></div>
    <p class="sec-lbl" id="vacLbl" style="display:none">Ubicaciones vacias</p>
    <div id="lV"><div class="loading"><div class="loading-spin"></div><div class="loading-txt">Cargando almacen...</div></div></div>
    <div id="secOcc" style="display:none">
      <p class="sec-lbl" style="margin-top:8px;color:#27ae60">Marcadas como ocupadas</p>
      <div id="lOcc"></div>
    </div>
  </div>
  <div id="pr" class="panel">
    <div class="chips">
      <div class="chip on" id="chM" onclick="setRot(0)">1 mes</div>
      <div class="chip" id="chT" onclick="setRot(1)">3 meses</div>
    </div>
    <div class="frow" id="rFil"></div>
    <p class="sec-lbl" id="rotLbl" style="display:none">Top picking por rotacion</p>
    <div id="lR"><div class="loading"><div class="loading-spin"></div><div class="loading-txt">Cargando almacen...</div></div></div>
  </div>
  <div id="pb" class="panel">
    <input class="srch" id="si" type="search" placeholder="Codigo, descripcion o ubicacion..." oninput="doSearch(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="lB"><div class="empty">Escribe para buscar</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="detailModal" onclick="closeDetail(event)">
  <div class="sheet" id="detailSheet">
    <div class="sheet-title">Referencia</div>
    <div class="detail-ref" id="dRef"></div>
    <div class="detail-desc" id="dDesc"></div>
    <div class="detail-row">
      <span class="detail-lbl">Ubicacion picking</span>
      <span class="detail-ubi" id="dUbi"></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Pasillo</span>
      <span class="detail-val" id="dPas"></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Zona</span>
      <span class="detail-val" id="dZona"></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Rotacion mensual</span>
      <span class="detail-val" id="dRotM"></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Rotacion trimestral</span>
      <span class="detail-val" id="dRotT"></span>
    </div>
    <div class="detail-row">
      <span class="detail-lbl">Existencias</span>
      <span class="detail-val" id="dEx"></span>
    </div>
    <button class="btn-close" onclick="document.getElementById('detailModal').className='overlay'">Cerrar</button>
  </div>
</div>

<script>
var D=[], V=[];
var rotMode=0, vacPas=0, rotPas=0;
var OCCUPIED_KEY='almacenA_occ_v1';
var manualOccupied={};

function loadOccupied(){
  try{
    var arr=JSON.parse(localStorage.getItem(OCCUPIED_KEY)||'[]');
    for(var i=0;i<arr.length;i++) manualOccupied[arr[i]]=true;
  }catch(e){}
}

function saveOccupied(){
  try{localStorage.setItem(OCCUPIED_KEY,JSON.stringify(Object.keys(manualOccupied)));}catch(e){}
}

function markOccupied(u){
  manualOccupied[u]=true;
  saveOccupied();
  renderVacias();
  renderStats();
  showToast(u+' marcada como ocupada');
}

function unmarkOccupied(u){
  delete manualOccupied[u];
  saveOccupied();
  renderVacias();
  renderStats();
  showToast(u+' devuelta a vacias');
}

function syncOccupiedWithCSV(){
  var vaciaSet={};
  for(var i=0;i<V.length;i++) vaciaSet[V[i][0]]=true;
  var changed=false;
  for(var u in manualOccupied){
    if(!vaciaSet[u]){delete manualOccupied[u];changed=true;}
  }
  if(changed) saveOccupied();
}

function subscribeRealtime(){}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast show';setTimeout(function(){t.className='toast';},2200);}
function pad2(n){return n<10?'0'+n:String(n);}

// ---- CSV FETCH ----
var CSV_URL='Almacen_A.csv';

function fetchCSV(){
  fetch(CSV_URL+'?v='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(txt){
      var result=parseCSV(txt);
      D=result.d; V=result.v;
      updateHeader(D.length);
      syncOccupiedWithCSV();
      renderAll();
    })
    .catch(function(err){
      showError('No se pudo cargar Almacen_A.csv<br>'+err.message);
    });
}

function showError(msg){
  var h='<div class="err-banner"><b>Error al cargar datos</b>'+msg+'</div>';
  document.getElementById('lV').innerHTML=h;
  document.getElementById('lR').innerHTML=h;
  document.getElementById('hsub').textContent='Error al cargar datos';
}

// ---- CSV PARSER (separador ; decimales con coma) ----
function parseCSVLine(line, sep){
  var result=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===sep&&!inQ){result.push(cur.trim());cur='';}
    else cur+=c;
  }
  result.push(cur.trim());
  return result;
}

function toFloat(s){return parseFloat(String(s||'0').replace(',','.').replace(/[^0-9.\-]/g,''))||0;}
function toInt(s){return parseInt(String(s||'0').replace(',','.'))||0;}

function parseCSV(txt){
  var lines=txt.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var headers=parseCSVLine(lines[0],';');

  // find column indexes by name
  function idx(name){for(var i=0;i<headers.length;i++)if(headers[i].trim()===name)return i;return -1;}
  var iCod=idx('Codigo'), iDesc=idx('Descripcion'), iUbi=idx('UbicacionCodigo');
  var iRotM=idx('UDS_1Mes'), iRotT=idx('UDS_3Meses');
  var iVol=idx('Volumen'), iPeso=idx('Peso'), iEx=idx('Existencias'), iCat=idx('Catalogo');

  var data=[], occupied={};
  for(var i=1;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    var f=parseCSVLine(line,';');
    var ubi=f[iUbi]||'';
    if(!ubi.trim()) continue;
    var parsed=parseUbi(ubi);
    var isPicking=0, zona=null;
    if(parsed){
      zona=parsed.p<=5?'P':'G';
      if(parsed.p>=1&&parsed.p<=5&&(parsed.n===0||parsed.n===1)) isPicking=1;
      if(parsed.p>=6&&parsed.p<=16&&parsed.n===0) isPicking=1;
      if(isPicking) occupied[parsed.p+','+parsed.c+','+parsed.n]=true;
    }
    data.push([
      f[iCod]||'',
      (f[iDesc]||'').substring(0,55),
      ubi,
      parsed?parsed.p:null,
      parsed?parsed.c:null,
      parsed?parsed.n:null,
      isPicking, zona,
      toInt(f[iRotM]), toInt(f[iRotT]),
      toFloat(f[iVol]), toFloat(f[iPeso]),
      toInt(f[iEx]),
      f[iCat]||''
    ]);
  }
  return {d:data, v:buildVacias(occupied)};
}

function parseUbi(ubi){
  if(!ubi||!ubi.startsWith('A')||ubi==='ALTILLOES'||ubi.startsWith('AA')) return null;
  try{
    var p=parseInt(ubi.substring(1,3),10);
    var c=parseInt(ubi.substring(3,5),10);
    var n=ubi.length>5?parseInt(ubi[5],10):0;
    if(isNaN(p)||isNaN(c)||isNaN(n)) return null;
    return {p:p,c:c,n:n};
  }catch(e){return null;}
}

var RESTRICTED={
  // Estructurales (pilares/pasos)
  'A06070':1,'A06071':1,'A06072':1,
  'A06140':1,'A06141':1,'A06142':1,
  'A06210':1,'A06211':1,'A06212':1,
  'A06280':1,'A06281':1,'A06282':1,
  'A06350':1,'A06351':1,'A06352':1,
  'A11130':1,'A11131':1,'A11132':1,
  'A11200':1,'A11201':1,'A11202':1,
  'A11270':1,'A11271':1,'A11272':1,
  // Sobrestock pasillo 05 (no picking)
  'A05201':1,'A05211':1,'A05231':1,
  'A05241':1,'A05251':1,'A05261':1,
  'A05271':1,'A05281':1,'A05301':1,
  'A05311':1,'A05321':1
};

function buildVacias(occupied){
  var byP={};
  for(var key in occupied){
    var pts=key.split(','), pp=parseInt(pts[0]), cc=parseInt(pts[1]), nn=parseInt(pts[2]);
    if(!byP[pp]) byP[pp]={};
    byP[pp][cc+','+nn]=true;
  }
  var vacias=[];
  var ps=Object.keys(byP).map(Number).sort(function(a,b){return a-b;});
  for(var pi=0;pi<ps.length;pi++){
    var pp=ps[pi];
    var allC=Object.keys(byP[pp]).map(function(k){return parseInt(k.split(',')[0]);});
    allC.sort(function(a,b){return a-b;});
    var minC=allC[0], maxC=allC[allC.length-1], z=pp<=5?'P':'G';
    for(var cc=minC;cc<=maxC;cc++){
      if(pp>=1&&pp<=5){for(var nn=0;nn<=1;nn++){var u='A'+pad2(pp)+pad2(cc)+nn;if(!byP[pp][cc+','+nn]&&!RESTRICTED[u])vacias.push([u,pp,z]);}}
      else{var u='A'+pad2(pp)+pad2(cc)+'0';if(!byP[pp][cc+',0']&&!RESTRICTED[u])vacias.push([u,pp,z]);}
    }
  }
  return vacias;
}

// ---- UI ----
function sw(t){
  var ids=['pv','pr','pb'];
  for(var i=0;i<3;i++){
    document.getElementById(ids[i]).className='panel'+(i===t?' on':'');
    document.querySelectorAll('.tab')[i].className='tab'+(i===t?' on':'');
  }
}
function updateHeader(n){
  var now=new Date().toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('hsub').textContent=n+' referencias \u00b7 '+now;
}

function renderAll(){
  renderStats();
  renderVacFilter();
  renderVacias();
  renderRotFilter();
  renderRot();
  document.getElementById('vacLbl').style.display='block';
  document.getElementById('rotLbl').style.display='block';
}

function renderStats(){
  if(!D.length){document.getElementById('sRow').innerHTML='';return;}
  var occ=new Set(D.map(function(r){return r[2];})).size;
  var manCount=Object.keys(manualOccupied).length;
  var realVacias=V.filter(function(v){return !manualOccupied[v[0]];}).length;
  var tot=occ+V.length;
  var pct=tot?Math.round((occ+manCount)/tot*1000)/10:0;
  document.getElementById('sRow').innerHTML=
    '<div class="sc"><div class="sv" style="color:#c0392b">'+realVacias+'</div><div class="sl">Vacias</div></div>'+
    '<div class="sc"><div class="sv">'+occ+'</div><div class="sl">Ocupadas</div></div>'+
    '<div class="sc"><div class="sv" style="color:#27ae60">'+pct+'%</div><div class="sl">Ocupacion</div></div>';
}

function renderVacFilter(){
  if(!V.length){document.getElementById('vFil').innerHTML='';return;}
  var ps=[0];
  for(var i=0;i<V.length;i++){if(!manualOccupied[V[i][0]]&&ps.indexOf(V[i][1])<0)ps.push(V[i][1]);}
  ps.sort(function(a,b){return a-b;});
  var h='';
  for(var i=0;i<ps.length;i++){var p=ps[i];h+='<div class="fp'+(p===vacPas?' on':'')+'" onclick="setVP('+p+')">'+(p===0?'Todos':'P'+pad2(p))+'</div>';}
  document.getElementById('vFil').innerHTML=h;
}
function setVP(p){vacPas=p;renderVacFilter();renderVacias();}

function renderVacias(){
  var open=V.filter(function(v){return !manualOccupied[v[0]]&&!RESTRICTED[v[0]]&&(!vacPas||v[1]===vacPas);});
  var closed=V.filter(function(v){return manualOccupied[v[0]]&&(!vacPas||v[1]===vacPas);});
  var el=document.getElementById('lV');
  if(!open.length){
    el.innerHTML='<div class="empty">No quedan ubicaciones vacias'+(vacPas?' en P'+pad2(vacPas):'')+' &#127881;</div>';
  } else {
    var h='<div class="card">';
    for(var i=0;i<open.length;i++){
      var v=open[i];
      h+='<div class="row"><div style="flex:1"><div class="ubi-big">'+v[0]+'</div>'+
         '<div class="rmeta">P'+pad2(v[1])+' &middot; '+(v[2]==='P'?'Pequeno':'Grande')+'</div></div>'+
         '<button class="btn-occ" onclick="markOccupied(\''+v[0]+'\')">&#10003; Ocupar</button></div>';
    }
    el.innerHTML=h+'</div>';
  }
  var secEl=document.getElementById('secOcc');
  if(!closed.length){secEl.style.display='none';return;}
  secEl.style.display='block';
  var h2='<div class="card">';
  for(var i=0;i<closed.length;i++){
    var v=closed[i];
    h2+='<div class="row row-occ"><div style="flex:1"><div class="ubi-big" style="color:#27ae60;font-size:16px">'+v[0]+'</div>'+
        '<div class="rmeta">P'+pad2(v[1])+' &middot; '+(v[2]==='P'?'Pequeno':'Grande')+'</div></div>'+
        '<span class="badge bg" style="margin-right:6px">Ocupada</span>'+
        '<button class="btn-undo" onclick="unmarkOccupied(\''+v[0]+'\')">Deshacer</button></div>';
  }
  document.getElementById('lOcc').innerHTML=h2+'</div>';
}

function renderRotFilter(){
  if(!D.length){document.getElementById('rFil').innerHTML='';return;}
  var h='<div class="fp'+(rotPas===0?' on':'')+'" onclick="setRP(0)">Todos</div>';
  for(var p=1;p<=16;p++) h+='<div class="fp'+(p===rotPas?' on':'')+'" onclick="setRP('+p+')">P'+pad2(p)+'</div>';
  document.getElementById('rFil').innerHTML=h;
}
function setRP(p){rotPas=p;renderRotFilter();renderRot();}
function setRot(m){
  rotMode=m;
  document.getElementById('chM').className='chip'+(m===0?' on':'');
  document.getElementById('chT').className='chip'+(m===1?' on':'');
  renderRot();
}
function renderRot(){
  if(!D.length){document.getElementById('lR').innerHTML='<div class="empty">Sin datos</div>';return;}
  var list=D.filter(function(r){return r[6]===1;});
  if(rotPas) list=list.filter(function(r){return r[3]===rotPas;});
  list=list.slice().sort(function(a,b){return rotMode===0?b[8]-a[8]:b[9]-a[9];}).slice(0,40);
  var maxR=list.length?(rotMode===0?list[0][8]:list[0][9]):1;
  if(!maxR) maxR=1;
  var el=document.getElementById('lR');
  if(!list.length){el.innerHTML='<div class="empty">Sin datos</div>';return;}
  var h='<div class="card">';
  for(var i=0;i<list.length;i++){
    var r=list[i], rot=rotMode===0?r[8]:r[9], pct=Math.round(rot/maxR*100);
    var clr=pct>66?'#e94560':pct>33?'#e67e22':'#27ae60';
    h+='<div class="row" onclick="openDetail('+D.indexOf(r)+')" style="cursor:pointer"><span class="rank">'+(i+1)+'</span>'+
       '<div style="flex:1;min-width:0;padding:0 8px">'+
         '<div style="display:flex;align-items:center;gap:6px"><span class="rref">'+r[0]+'</span>'+
         '<span class="badge bp" style="font-size:9px">P'+pad2(r[3])+'</span></div>'+
         '<div class="rdesc">'+r[1]+'</div>'+
         '<div style="margin-top:4px"><div class="rot-bg"><div class="rot-fill" style="width:'+pct+'%;background:'+clr+'"></div></div></div>'+
       '</div>'+
       '<div style="text-align:right;min-width:40px">'+
         '<div style="font-size:14px;font-weight:700;color:#1a1a2e">'+rot+'</div>'+
         '<div style="font-size:9px;color:#aaa">'+(rotMode===0?'/mes':'/trim')+'</div>'+
       '</div></div>';
  }
  el.innerHTML=h+'</div>';
}

function doSearch(q){
  var el=document.getElementById('lB');
  if(!D.length){el.innerHTML='<div class="empty">Sin datos cargados</div>';return;}
  if(!q||q.length<2){el.innerHTML='<div class="empty">Escribe para buscar</div>';return;}
  var ql=q.toLowerCase(), res=[];
  for(var i=0;i<D.length&&res.length<25;i++){
    var r=D[i];
    if(r[6]!==1) continue;
    if(r[0].toLowerCase().indexOf(ql)>=0||r[1].toLowerCase().indexOf(ql)>=0||r[2].toLowerCase().indexOf(ql)>=0) res.push(r);
  }
  if(!res.length){el.innerHTML='<div class="empty">Sin resultados para "'+q+'"</div>';return;}
  var h='<div class="card">';
  for(var i=0;i<res.length;i++){
    var r=res[i];
    h+='<div class="row"><div style="flex:1;min-width:0">'+
       '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap"><span class="rref">'+r[0]+'</span>'+
       (r[6]?'<span class="badge bg" style="font-size:9px">Picking</span>':'')+
       '<span class="badge bp" style="font-size:9px">'+r[2]+'</span></div>'+
       '<div class="rdesc">'+r[1]+'</div>'+
       '<div class="rmeta">Rot/mes: '+r[8]+' &middot; Exist: '+r[12]+' &middot; '+(r[7]==='P'?'pequeno':'grande')+'</div>'+
       '</div></div>';
  }
  el.innerHTML=h+'</div>';
}

// ---- DETAIL MODAL ----
function openDetail(idx){
  var r=D[idx];
  document.getElementById('dRef').textContent=r[0];
  document.getElementById('dDesc').textContent=r[1];
  document.getElementById('dUbi').textContent=r[2]||'Sin ubicacion';
  document.getElementById('dPas').textContent=r[3]?'Pasillo '+pad2(r[3]):'—';
  document.getElementById('dZona').textContent=r[7]==='P'?'Pequeno (P01-P05)':r[7]==='G'?'Grande (P06-P16)':'—';
  document.getElementById('dRotM').textContent=r[8]+' uds/mes';
  document.getElementById('dRotT').textContent=r[9]+' uds/trimestre';
  document.getElementById('dEx').textContent=r[12]+' uds';
  document.getElementById('detailModal').className='overlay on';
}
function closeDetail(e){if(e.target===document.getElementById('detailModal'))document.getElementById('detailModal').className='overlay';}

// ---- INIT ----
fetchCSV();
loadOccupied();
subscribeRealtime();
</script>
<script>
// Force pinch zoom on Edge Android
(function(){
  var lastScale=1, lastX=0, lastY=0;
  var meta=document.querySelector('meta[name=viewport]');
  function setZoom(scale,x,y){
    scale=Math.min(Math.max(scale,1),5);
    meta.setAttribute('content','width=device-width, initial-scale='+scale+', minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes');
  }
  var startDist=0;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      var scale=lastScale*(dist/startDist);
      setZoom(scale);
    }
  },{passive:true});
  document.addEventListener('touchend',function(e){
    var meta=document.querySelector('meta[name=viewport]');
    var content=meta.getAttribute('content');
    var match=content.match(/initial-scale=([\d.]+)/);
    if(match) lastScale=parseFloat(match[1]);
  },{passive:true});
})();
</script>
